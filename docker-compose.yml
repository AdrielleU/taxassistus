# Tax Assist US as a shared server: Caddy (HTTPS + login) in front of `taxassist.py serve`.
#   cp .env.example .env    # then fill it in (see README, "Docker server")
#   podman network create network_container    # once per host, shared by every stack
#   podman-compose up -d    # Docker: docker compose up -d
# Everyone who logs in sees and edits the SAME my_tax_files/. Stop: podman-compose down
#
# Names: service = container_name = network alias, prefixed taxassist, so they don't
# collide with other stacks on network_container.
#
# Data stays in this folder (bind mounts, no named volumes), so a folder backup has it all:
#   my_tax_files/        the tax files (private; git ignores it)
#   data/caddy/data/     Caddy's certificates and keys (private; git ignores it)
#   data/caddy/config/   Caddy's autosaved config
#
# SELinux: lowercase :z (shared label) everywhere, because taxassist mounts the whole
# folder and would relabel a private :Z mount underneath it on every start.
#
# Images are pinned. To update: change the tag, then podman-compose pull && podman-compose up -d
name: taxassist

services:
  taxassist:
    image: docker.io/library/python:3.12.15-alpine3.24
    container_name: taxassist
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "tools/taxassist.py", "serve", "--bind", "0.0.0.0", "--port", "8765"]
    environment:
      TZ: America/Phoenix
      TAXASSIST_ALLOWED_HOSTS: ${TAXASSIST_DOMAIN:?set TAXASSIST_DOMAIN in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    user: "${TAXASSIST_UID:-1000}:${TAXASSIST_GID:-1000}"
    volumes:
      - ./:/app:ro,z                          # code and templates, read-only
      - ./my_tax_files:/app/my_tax_files:z    # the only writable folder
    read_only: true
    tmpfs:
      - /tmp
      # Empty, so serve can't publish Caddy's keys in ./data. notmpcopyup is required:
      # Podman otherwise copies the folder's files into the tmpfs.
      - /app/data:notmpcopyup
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No published port: people reach it through taxassist-caddy's login. Other containers
    # on network_container can reach it directly, so only run trusted stacks there.
    networks:
      network_container:
        aliases: [taxassist]

  taxassist-caddy:
    image: docker.io/library/caddy:2.11.7-alpine
    container_name: taxassist-caddy
    restart: unless-stopped
    depends_on: [taxassist]
    ports:
      - "${TAXASSIST_HTTP_PORT:-80}:80"
      - "${TAXASSIST_HTTPS_PORT:-443}:443"
    environment:
      TZ: America/Phoenix
      TAXASSIST_DOMAIN: ${TAXASSIST_DOMAIN:?set TAXASSIST_DOMAIN in .env}
      TAXASSIST_TLS: ${TAXASSIST_TLS:-internal}
      TAXASSIST_USER: ${TAXASSIST_USER:?set TAXASSIST_USER in .env}
      TAXASSIST_PASSWORD_HASH: ${TAXASSIST_PASSWORD_HASH:?set TAXASSIST_PASSWORD_HASH in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./data/caddy/data:/data:z
      - ./data/caddy/config:/config:z
    networks:
      network_container:
        aliases: [taxassist-caddy]

networks:
  network_container:
    name: network_container
    # Shared with the other stacks on this host, so it's created ONCE out of band and
    # compose only joins it:  podman network create network_container
    # Without it the stack fails to start with "network not found".
    external: true
