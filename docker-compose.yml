# Tax Assist US as a shared server: Caddy (login popup) in front of `taxassist.py serve`.
#   cp .env.example .env    # then set TAXASSIST_HOSTS (see README, "Docker server")
#   podman network create network_container    # once per host, shared by every stack
#   mkdir -p data/caddy/data data/caddy/config  # once
#   podman-compose up -d    # Docker: docker compose up -d
# then open http://<this server>:17202 and log in with TAXASSIST_LOGIN_USER and your password
# Everyone who logs in sees and edits the SAME my_tax_files/. Stop: podman-compose down
#
# The login is in .env: TAXASSIST_LOGIN_USER and TAXASSIST_LOGIN_HASH (a bcrypt hash; the
# password itself is never stored). .env.example shows how to make the hash. Without them
# compose refuses to start, so Tax Assist US is never served without the login.
# It's plain HTTP: fine on the home network. From outside, use a VPN.
#
# Names: service = container_name = network alias, prefixed taxassist, so they don't
# collide with other stacks on network_container.
#
# Data stays in this folder (bind mounts, no named volumes), so a folder backup has it all:
#   my_tax_files/        the tax files (private; git ignores it)
#   data/caddy/data/     Caddy's state (private; git ignores it)
#   data/caddy/config/   Caddy's autosaved config
#
# SELinux: lowercase :z (shared label) everywhere, because taxassist mounts the whole
# folder and would relabel a private :Z mount underneath it on every start.
#
# Images are pinned. To update: change the tag, then podman-compose pull && podman-compose up -d
name: taxassist

services:
  taxassist:
    image: docker.io/library/python:3.12.15-alpine3.24
    container_name: taxassist
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "tools/taxassist.py", "serve", "--bind", "0.0.0.0", "--port", "8765"]
    environment:
      TZ: America/Phoenix
      TAXASSIST_ALLOWED_HOSTS: ${TAXASSIST_HOSTS:?set TAXASSIST_HOSTS in .env}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    user: "${TAXASSIST_UID:-1000}:${TAXASSIST_GID:-1000}"
    volumes:
      - ./:/app:ro,z                          # code and templates, read-only
      - ./my_tax_files:/app/my_tax_files:z    # the only writable folder
    read_only: true
    tmpfs:
      - /tmp
      # Empty, so serve can't publish Caddy's state in ./data. notmpcopyup is required:
      # Podman otherwise copies the folder's files into the tmpfs.
      - /app/data:notmpcopyup
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No published port: people reach it through taxassist-caddy's login. Other containers
    # on network_container can reach it directly, so only run trusted stacks there.
    networks:
      network_container:
        aliases: [taxassist]

  taxassist-caddy:
    image: docker.io/library/caddy:2.11.7-alpine
    container_name: taxassist-caddy
    restart: unless-stopped
    depends_on: [taxassist]
    entrypoint: ["caddy", "run", "--config", "/setup/Caddyfile", "--adapter", "caddyfile"]
    ports:
      # The login page, for the local network: host port 17202 -> Caddy's 80.
      # Pick another host port by changing the first number. This machine only:
      # "127.0.0.1:17202:80".
      - "17202:80"
    environment:
      TZ: America/Phoenix
      # The login, from .env (compose reads it on the host, so Caddy never gets the project folder)
      TAXASSIST_LOGIN_USER: ${TAXASSIST_LOGIN_USER:?set TAXASSIST_LOGIN_USER in .env (see .env.example)}
      TAXASSIST_LOGIN_HASH: ${TAXASSIST_LOGIN_HASH:?set TAXASSIST_LOGIN_HASH in .env (see .env.example)}
    volumes:
      - ./docker:/setup:ro,z                  # the Caddyfile
      - ./data/caddy/data:/data:z
      - ./data/caddy/config:/config:z
    networks:
      network_container:
        aliases: [taxassist-caddy]

networks:
  network_container:
    name: network_container
    # Shared with the other stacks on this host, so it's created ONCE out of band and
    # compose only joins it:  podman network create network_container
    # Without it the stack fails to start with "network not found".
    external: true
